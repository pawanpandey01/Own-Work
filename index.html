<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Daymark — Your task list</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20251f;
      --muted: #737a70;
      --line: #e7e7df;
      --paper: #fff;
      --canvas: #f5f4f0;
      --card-border: rgb(231 231 223 / 85%);
      --input-bg: #fcfcfa;
      --placeholder: #a1a59e;
      --row-line: #f0f0eb;
      --check-border: #c9cec5;
      --completed: #9a9f97;
      --completed-line: #b8beb5;
      --delete: #959b92;
      --delete-hover: #a64f3d;
      --delete-hover-bg: #fbefeb;
      --storage-message: #98603e;
      --footer: #8a9087;
      --green: #47745b;
      --green-dark: #345a45;
      --green-pale: #e8f0e9;
      --orange: #cc7855;
      --shadow: 0 18px 55px rgb(38 44 35 / 8%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e8ece5;
      --muted: #a3aca1;
      --line: #373f38;
      --paper: #202722;
      --canvas: #151a16;
      --card-border: #343c35;
      --input-bg: #1a211c;
      --placeholder: #879187;
      --row-line: #303831;
      --check-border: #69766a;
      --completed: #879187;
      --completed-line: #69766a;
      --delete: #a3aca1;
      --delete-hover: #f0a38e;
      --delete-hover-bg: #3b2925;
      --storage-message: #e1aa83;
      --footer: #879187;
      --green: #75a985;
      --green-dark: #8cba98;
      --green-pale: #293a2e;
      --orange: #e39a76;
      --shadow: 0 18px 55px rgb(0 0 0 / 22%);
      --glass: rgb(32 39 34 / 82%);
      --row-hover: #27312a;
      --brand-shadow: 0 8px 18px rgb(0 0 0 / 20%);
    }

    :root {
      --glass: rgb(255 255 255 / 76%);
      --row-hover: #f7f8f4;
      --brand-shadow: 0 8px 18px rgb(52 90 69 / 22%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 8%, var(--canvas-glow, rgb(228 234 222 / 58%)), transparent 34rem),
        radial-gradient(ellipse at 92% 55%, rgb(204 120 85 / 8%), transparent 32rem),
        var(--canvas);
      transition: background-color .25s, color .25s;
    }

    :root[data-theme="dark"] { --canvas-glow: rgb(67 91 69 / 19%); }

    button, input { font: inherit; }
    button { color: inherit; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 57px;
      padding: 11px 12px 11px 15px;
      border: 1px solid var(--card-border);
      border-radius: 17px;
      background: var(--glass);
      box-shadow: 0 8px 28px rgb(38 44 35 / 4%);
      backdrop-filter: blur(16px);
    }

    .page {
      width: min(100% - 36px, 790px);
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--green-dark);
      font-size: .88rem;
      font-weight: 750;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      height: 34px;
      width: 34px;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, #669876, var(--green-dark));
      box-shadow: var(--brand-shadow);
    }

    .brand-mark svg { width: 18px; height: 18px; }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: var(--glass);
      font-size: .84rem;
      font-weight: 650;
      cursor: pointer;
      transition: color .18s, border-color .18s, background .18s, transform .18s;
    }

    .theme-toggle:hover {
      border-color: var(--green);
      color: var(--green-dark);
      transform: translateY(-1px);
    }

    .theme-toggle svg { width: 17px; height: 17px; }

    .intro { margin-bottom: 31px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 15px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green-dark);
      background: var(--glass);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 4px rgb(204 120 85 / 13%);
      content: "";
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 8vw, 4.65rem);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: .99;
    }

    .hero-accent {
      color: var(--green-dark);
      font-style: italic;
      font-weight: 400;
    }

    .subtitle {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 1.03rem;
      line-height: 1.6;
    }

    .task-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--card-border);
      border-radius: 23px;
      background: var(--paper);
      box-shadow: var(--shadow), 0 2px 5px rgb(38 44 35 / 3%);
      transition: background-color .25s, border-color .25s, box-shadow .25s;
    }

    .task-card::before {
      position: absolute;
      z-index: 1;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--green), #a5bd83 52%, var(--orange));
      content: "";
    }

    .add-form {
      display: flex;
      gap: 12px;
      padding: 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, var(--input-bg), var(--paper));
    }

    .task-input {
      width: 100%;
      min-width: 0;
      height: 54px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: var(--input-bg);
      transition: border-color .18s, box-shadow .18s;
    }

    .task-input::placeholder { color: var(--placeholder); }
    .task-input:focus {
      border-color: #88a591;
      box-shadow: 0 0 0 3px rgb(71 116 91 / 13%);
    }

    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 111px;
      height: 54px;
      padding: 0 19px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, #5a8968, var(--green-dark));
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 16px rgb(52 90 69 / 18%);
      transition: background .18s, transform .18s, box-shadow .18s;
    }

    .add-button:hover {
      background: linear-gradient(135deg, var(--green-dark), #294a37);
      box-shadow: 0 10px 20px rgb(52 90 69 / 25%);
      transform: translateY(-1px);
    }
    .add-button:active { transform: translateY(1px); }
    .add-button svg { width: 17px; height: 17px; }

    .task-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 21px 25px 13px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .task-count {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--input-bg);
      font-size: .8rem;
      letter-spacing: normal;
      text-transform: none;
    }

    .count-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 3px rgb(204 120 85 / 12%);
    }

    .task-list {
      display: grid;
      margin: 0;
      padding: 0 13px 13px;
      list-style: none;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 67px;
      padding: 11px 13px;
      border-radius: 13px;
      border-top: 1px solid var(--row-line);
      animation: arrive .2s ease-out both;
      transition: background .18s, transform .18s;
    }

    .task-row:hover {
      background: var(--row-hover);
      transform: translateX(2px);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .complete-button {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
      border: 1.7px solid var(--check-border);
      border-radius: 50%;
      background: var(--paper);
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }

    .complete-button:hover { border-color: var(--green); transform: scale(1.06); }
    .complete-button svg { width: 13px; height: 13px; opacity: 0; color: white; }
    .task-row.is-complete .complete-button {
      border-color: var(--green);
      background: var(--green);
    }
    .task-row.is-complete .complete-button svg { opacity: 1; }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: .97rem;
      line-height: 1.45;
    }

    .task-row.is-complete .task-text {
      color: var(--completed);
      text-decoration: line-through;
      text-decoration-color: var(--completed-line);
    }

    .delete-button {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: var(--delete);
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: color .18s, background .18s, opacity .18s;
    }

    .task-row:hover .delete-button,
    .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: var(--delete-hover); background: var(--delete-hover-bg); }
    .delete-button svg { width: 17px; height: 17px; }

    .empty-state {
      display: grid;
      min-height: 230px;
      padding: 32px 20px 42px;
      place-content: center;
      justify-items: center;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 54px;
      height: 54px;
      margin-bottom: 16px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--green);
      background: linear-gradient(145deg, var(--green-pale), var(--input-bg));
      box-shadow: 0 8px 18px rgb(38 44 35 / 5%);
    }

    .empty-icon svg { width: 23px; height: 23px; }
    .empty-title { margin: 0; font-weight: 700; }
    .empty-copy { margin: 6px 0 0; color: var(--muted); font-size: .88rem; }

    .storage-message {
      margin: 13px 4px 0;
      color: var(--storage-message);
      font-size: .84rem;
    }

    .footer-note {
      margin: 20px 0 0;
      color: var(--footer);
      font-size: .82rem;
      text-align: center;
    }

    button:focus-visible {
      outline: 3px solid rgb(71 116 91 / 35%);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 24px, 790px); padding-top: 34px; }
      .topbar { margin-bottom: 42px; }
      h1 { font-size: clamp(2.7rem, 12vw, 3.6rem); }
      .add-form { gap: 8px; padding: 15px; }
      .add-button { min-width: 50px; padding: 0 15px; }
      .add-button-label { display: none; }
      .theme-label { display: none; }
      .theme-toggle { width: 40px; padding: 0; }
      .task-meta { padding-right: 18px; padding-left: 18px; }
      .task-list { padding-right: 8px; padding-left: 8px; }
      .task-row { gap: 11px; }
      .delete-button { opacity: 1; }
    }

    @media (max-width: 380px) {
      .page { width: min(100% - 20px, 790px); }
      .topbar { padding-left: 11px; }
      .add-form { padding: 12px; }
      .task-input { padding: 0 12px; }
      .task-meta { padding-right: 14px; padding-left: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand" aria-label="Daymark">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 12 4 4L19 6"></path>
          </svg>
        </span>
        Daymark
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
        <span class="theme-label" id="theme-label">Dark mode</span>
      </button>
    </div>

    <header class="intro">
      <p class="eyebrow">A little clarity, every day</p>
      <h1>Make room for<br><span class="hero-accent">what matters.</span></h1>
      <p class="subtitle">One thing at a time. Add a task and get started.</p>
    </header>

    <section class="task-card" aria-labelledby="task-heading">
      <form class="add-form" id="task-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <input class="task-input" id="task-input" name="task" type="text" maxlength="240" placeholder="What needs doing?" autocomplete="off" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span class="add-button-label">Add task</span>
        </button>
      </form>

      <div class="task-meta">
        <span id="task-heading">Your list</span>
        <span class="task-count" id="task-count" aria-live="polite"><span class="count-dot" aria-hidden="true"></span><span id="task-count-text"></span></span>
      </div>
      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
    </section>

    <p class="storage-message" id="storage-message" role="status" hidden></p>
    <p class="footer-note">Your list stays on this device, right where you left it.</p>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "daymark.tasks.v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const countText = document.querySelector("#task-count-text");
      const storageMessage = document.querySelector("#storage-message");
      const themeToggle = document.querySelector("#theme-toggle");
      const themeIcon = document.querySelector("#theme-icon");
      const themeLabel = document.querySelector("#theme-label");
      const THEME_KEY = "daymark.theme.v1";
      let tasks = [];
      let storageAvailable = true;

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const isDark = theme === "dark";
        themeToggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} mode`);
        themeLabel.textContent = `${isDark ? "Light" : "Dark"} mode`;
        themeIcon.replaceChildren();
        const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
        if (isDark) {
          shape.setAttribute("d", "M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z");
        } else {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", "12");
          circle.setAttribute("cy", "12");
          circle.setAttribute("r", "4");
          themeIcon.append(circle);
          shape.setAttribute("d", "M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42");
        }
        themeIcon.append(shape);
        document.querySelector('meta[name="theme-color"]').content = isDark ? "#151a16" : "#f5f4f0";
      }

      function loadTheme() {
        try {
          const savedTheme = localStorage.getItem(THEME_KEY);
          if (savedTheme === "light" || savedTheme === "dark") return savedTheme;
        } catch {
          setStorageMessage("Your appearance preference could not be loaded.");
        }
        return globalThis.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      themeToggle.addEventListener("click", () => {
        const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(theme);
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch {
          setStorageMessage("Your appearance choice could not be saved and may reset after you leave.");
        }
      });

      function setStorageMessage(message) {
        storageMessage.textContent = message;
        storageMessage.hidden = !message;
      }

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) return [];
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new TypeError("Saved tasks must be a list.");
          return parsed.filter(task =>
            task &&
            typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          );
        } catch {
          setStorageMessage("Saved tasks could not be read. You can still use this list for now.");
          storageAvailable = false;
          return [];
        }
      }

      function saveTasks() {
        if (!storageAvailable) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {
          storageAvailable = false;
          setStorageMessage("Your browser could not save this list. Changes may not persist after you leave.");
        }
      }

      function makeIcon(path, viewBox = "0 0 24 24") {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", viewBox);
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "2");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
        shape.setAttribute("d", path);
        svg.append(shape);
        return svg;
      }

      function render() {
        list.replaceChildren();
        const remaining = tasks.filter(task => !task.completed).length;
        countText.textContent = `${remaining} ${remaining === 1 ? "task left" : "tasks left"}`;

        if (tasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.append(makeIcon("M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"));
          const title = document.createElement("p");
          title.className = "empty-title";
          title.textContent = "A fresh start";
          const copy = document.createElement("p");
          copy.className = "empty-copy";
          copy.textContent = "Your list is clear. Add your first task above.";
          empty.append(icon, title, copy);
          list.append(empty);
          return;
        }

        for (const task of tasks) {
          const row = document.createElement("li");
          row.className = `task-row${task.completed ? " is-complete" : ""}`;

          const completeButton = document.createElement("button");
          completeButton.className = "complete-button";
          completeButton.type = "button";
          completeButton.setAttribute("aria-label", `${task.completed ? "Mark as incomplete" : "Complete"}: ${task.text}`);
          completeButton.setAttribute("aria-pressed", String(task.completed));
          completeButton.append(makeIcon("m5 12 4 4L19 6"));
          completeButton.addEventListener("click", () => {
            task.completed = !task.completed;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.setAttribute("aria-label", `Delete: ${task.text}`);
          deleteButton.append(makeIcon("M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"));
          deleteButton.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            render();
          });

          row.append(completeButton, text, deleteButton);
          list.append(row);
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }

        tasks.unshift({
          id: globalThis.crypto && typeof globalThis.crypto.randomUUID === "function"
            ? globalThis.crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          text,
          completed: false
        });
        saveTasks();
        render();
        form.reset();
        input.focus();
      });

      applyTheme(loadTheme());
      tasks = loadTasks();
      render();
    })();
  </script>
</body>
</html>
